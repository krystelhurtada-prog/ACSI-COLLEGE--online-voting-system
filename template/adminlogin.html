<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login - ACSI College Iloilo</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #111;
    }

    .header {
        background: #b30000;
        color: white;
        text-align: center;
        padding: 25px 20px;
    }

    .header h1 {
        font-size: 28px;
        margin-bottom: 8px;
    }

    .header p {
        font-size: 15px;
    }

    .login-container {
        width: 90%;
        max-width: 400px;
        margin: 60px auto;
    }

    .login-box {
        background: white;
        padding: 30px;
        border-radius: 10px;
        border-top: 6px solid #b30000;
        box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    .login-box h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #b30000;
    }

    .error-message {
        background: #ffe5e5;
        color: #b30000;
        padding: 12px;
        margin-bottom: 18px;
        border-radius: 6px;
        text-align: center;
        font-weight: bold;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    .login-btn {
        width: 100%;
        padding: 13px;
        background: #b30000;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-btn:hover {
        background: #8f0000;
    }

    .back-btn {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #b30000;
        text-decoration: none;
        font-weight: bold;
    }
</style>

</head><body><div class="header">
    <h1>ACSI COLLEGE ILOILO</h1>
    <p>ONLINE VOTING SYSTEM</p>
</div><div class="login-container"><div class="login-box">

    <h2>ADMIN LOGIN</h2>

    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    <form action="/adminlogin" method="POST">

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter admin username"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter admin password"
            required
        >

        <button type="submit" class="login-btn">
            LOGIN
        </button>

    </form>

    <a href="/" class="back-btn">Back to Home</a>

</div>

</div></body>
</html>
