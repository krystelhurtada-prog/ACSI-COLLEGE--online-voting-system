<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voter Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .header {
            background: #b30000;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
        }

        .form-container {
            padding: 30px;
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #111;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #111;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border: 2px solid #b30000;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #b30000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #8f0000;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .register-text p {
            margin-bottom: 6px;
        }

        .register-text a {
            color: #b30000;
            font-weight: bold;
            text-decoration: none;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .back-btn {
            display: block;
            margin-top: 15px;
            color: #b30000;
            text-align: center;
            text-decoration: none;
            font-weight:bold;
        }

        .back-btn:hover {
            color: #b30000;
            text-decoration: underline;
        }

        .error {
            background: #ffe5e5;
            color: #b30000;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="header">
            <h1>ACSI COLLEGE ILOILO</h1>
            <p>ONLINE VOTING SYSTEM</p>
        </div>

        <div class="form-container">

            <h2>Voter Login</h2>

            <!-- ERROR / WARNING MESSAGE -->
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="error">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form action="/vlogin" method="POST">

                <label for="student_id">Student ID</label>

                <input
                
                    type="text"
                    name="student_id"
                    id="student_id"
                    placeholder="Enter 9-digit Student ID"
                    inputmode="numeric"
                    maxlength="9"
                    minlength="9"
                    pattern="[0-9]{9}"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 9)"
                    required
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your Password"
                    required
                >

                <label for="course">Course</label>

                <select id="course" name="course" required>
                    <option value="" disabled selected>
                        Select your Course
                    </option>
                    <option value="BSCS">BSCS</option>
                    <option value="BSIS">BSIS</option>
                    <option value="ACT">ACT</option>
                    <option value="SHS">SHS</option>
                </select>

                <button type="submit" class="login-btn">
                    LOGIN
                </button>

            </form>

            <!-- REGISTRATION LINK -->
            <div class="register-text">
                <p>Don't have an account?</p>
                <a href="/register">Register here</a>
            </div>

            <a href="/" class="back-btn">
                 Back to Home
            </a>

        </div>

    </div>

</body>
</html>
