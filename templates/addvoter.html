<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Voter</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #111;
    }

    .header {
        background: #b30000;
        color: white;
        padding: 25px;
        text-align: center;
    }

    .header h1 {
        font-size: 25px;
    }

    .header p {
        margin-top: 5px;
    }

    .container {
        max-width: 500px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input,
    select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
        background: white;
    }

    button {
        width: 100%;
        margin-top: 25px;
        padding: 13px;
        background: #b30000;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #800000;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #b30000;
        text-decoration: none;
    }
</style>

</head><body><div class="header">
    <h1>ACSI COLLEGE ILOILO</h1>
    <p>ONLINE VOTING SYSTEM</p>
</div>

<div class="container">

    <h2>Add Voter</h2>

    <form method="POST">

        <label>Student ID</label>
        <input
            type="text"
            name="student_id"
            placeholder="Enter Student ID"
            required
        >

        <label>Student Name</label>
        <input
            type="text"
            name="student_name"
            placeholder="Enter Student Name"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >

        <label>Course</label>

<select name="course" required>
    <option value="" disabled selected>Select Course</option>
    <option value="BSCS">BSCS</option>
    <option value="BSIS">BSIS</option>
    <option value="ACT">ACT</option>
    <option value="SHS">SHS</option>
</select>


        

    

        <button type="submit">Add Voter</button>

    </form>

    <a href="{{ url_for('dashboard') }}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
